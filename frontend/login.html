<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Subhadip Portfolio</title>

<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/global.css">

</head>



<body>

 <!-- ===== LOGIN NAVBAR ===== -->
<header class="login-navbar">

    <div class="login-logo">
        <a href="index.html">
            <img src="assets/icons/svg.png" alt="Subhadip Logo">
            <span>Subhadip Roy</span>
        </a>
    </div>

    <nav class="login-nav">
        <a href="index.html" class="home-btn">
            Home
        </a>
    </nav>

</header>

<div class="login-container">

    <div class="login-card">

        <h1>Admin Login</h1>
        <p>Subhadip Portfolio Dashboard</p>

        <form id="loginForm">

    <div class="input-group">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter Admin Email" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter Password" required>
    </div>

    <button type="submit" class="login-btn">
        Login
    </button>

</form>




    </div>

</div>

<script src="assets/js/login.js"></script>

</body>
</html>
